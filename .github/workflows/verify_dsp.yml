name: DeepCarrier-Pulse Flight DSP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-dsp-pipeline:
    name: Verify Flight DSP Engine & NASA CCSDS Telemetry
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Flight DSP Engine & NASA CCSDS Telemetry
        run: |
          python deepspace_signal_engine.py
          python -m pytest tests/ -v

      - name: Generate Executive Presentation Deck
        run: |
          python build_deck.py

      - name: Upload Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mission-verification-artifacts-${{ matrix.python-version }}
          path: |
            deepspace_mission_verification.png
            presentation_deck.pdf
