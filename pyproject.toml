[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcarrier-pulse"
version = "1.0.0"
description = "Autonomous EKF-Assisted Deep-Space Carrier Acquisition & CCSDS Slicer (TRL-6)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "DeepCarrier-Pulse Team", email = "fokrulanthro16@gmail.com" }
]
keywords = [
    "aerospace",
    "deep-space",
    "dsp",
    "extended-kalman-filter",
    "doppler-tracking",
    "costas-loop",
    "gardner-ted",
    "nasa-ccsds",
    "space-telemetry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
